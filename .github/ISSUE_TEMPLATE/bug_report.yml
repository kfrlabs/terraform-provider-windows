name: Bug report
description: Report a reproducible problem with the provider.
labels: [bug]
body:
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      description: Output of `terraform version` for the windows provider, or the release tag.
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Output of `terraform version` (core).
      placeholder: 1.11.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Target host OS, e.g. Windows Server 2025, Windows 11 24H2, and PowerShell edition (5.1 / 7.x).
      placeholder: Windows Server 2025, PowerShell 7.4
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration snippet
      description: Minimal HCL that reproduces the problem.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including the diagnostic text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: TF_LOG=DEBUG excerpt
      description: >
        Relevant excerpt with TF_LOG=DEBUG. Do NOT paste secrets, credentials,
        private keys, passwords, or live host details — redact them before posting.
      render: text
    validations:
      required: false
