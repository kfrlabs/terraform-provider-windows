# Automated dependency updates.
#
#   - Go modules: weekly, grouped to avoid PR spam. Patch + minor only.
#     Major bumps require human review (Plugin Framework breaking changes).
#   - GitHub Actions: weekly, pin to SHA recommended downstream but kept
#     on tags here for readability; Dependabot updates them in lockstep.
#
#   - Security updates are enabled separately at the repository level
#     (Settings -> Code security -> Dependabot security updates); this file
#     only configures version updates. Per the Dependabot docs, advisory
#     PRs bypass everything below: they are not subject to
#     open-pull-requests-limit (separate fixed limit), are not captured by
#     groups scoped with `applies-to: version-updates`, and are unaffected
#     by `ignore` entries scoped with `update-types: version-update:*`
#     (see #205).

version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      hashicorp-tf:
        applies-to: version-updates
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      test-deps:
        applies-to: version-updates
        patterns:
          - "github.com/stretchr/*"
          - "github.com/google/go-cmp"
    ignore:
      # Major bumps on the framework are breaking; flag manually.
      - dependency-name: "github.com/hashicorp/terraform-plugin-framework"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github.com/hashicorp/terraform-plugin-go"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
