# Continuous Integration: build / vet / lint / unit-tests on every push and PR.
#
# The unit suite includes the transport tests in internal/winclient, which
# drive a real SSH handshake against an in-process server on loopback (see
# sshtest_test.go). They need no Windows host and no network, so they belong
# here rather than in the acceptance workflow.
#
# Acceptance tests (TF_ACC=1) are NOT executed here: they require a live
# Windows host reachable over SSH and a valid set of credentials. They run in
# testacc-windows.yml, on a Windows runner that acts as its own target.
#
# Matrix: track the Go floor declared in go.mod (currently 1.26). Older
# minors are not buildable under GOTOOLCHAIN=local once the go directive
# moves past them, so keep the matrix at or above that floor.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & vet (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...

  test:
    name: unit tests
    runs-on: ubuntu-latest
    # No `needs: build`: `go test` compiles the packages it exercises on its
    # own, in a fresh runner that shares no build cache with the `build` job
    # anyway. Gating this job behind `build` only serialised two independent
    # ~20-40s jobs for no benefit; running them in parallel is the single
    # biggest win in this workflow's wall-clock time.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Use the toolchain pinned in go.mod for the canonical test run.
          go-version-file: go.mod
          cache: true

      - name: go test -short
        run: go test -short -race -timeout 120s -coverprofile=coverage.out ./...

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # .golangci.yml at the repo root drives the rule set (incl. run.timeout).

  terraform-cli-offline:
    # Hermetic Terraform-CLI tier for test/terraform-cli: init, fmt -check,
    # validate and the mocked `terraform test` run — none of which needs a
    # Windows host or credentials. This exercises the provider through the
    # real CLI (schema serving, example HCL, mock wiring) in a way Go unit
    # tests cannot. Online --apply stages stay out: they need the lab host.
    name: terraform CLI offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build provider (linux_amd64 dev build)
        run: go build -trimpath -o ${{ runner.temp }}/plugins/terraform-provider-windows .

      # Pinned to the version the suite is verified against (see #134).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: offline stages (init, fmt, validate, mocked test)
        working-directory: test/terraform-cli
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: |
          printf 'provider_installation {\n  dev_overrides {\n    "kfrlabs/windows" = "%s/plugins"\n  }\n  direct {}\n}\n' '${{ runner.temp }}' > "$TF_CLI_CONFIG_FILE"
          terraform init -input=false
          terraform fmt -check -diff .
          terraform validate
          terraform test -test-directory=.

      - name: examples schema-decode check (no Unsupported block type)
        # Guards #142: SingleNestedAttribute values such as `timeouts` must
        # use the assignment form (`timeouts = { ... }`); the bare block form
        # (`timeouts { ... }`) is rejected by `terraform validate` with
        # "Unsupported block type". Each examples/ directory is validated in
        # a scratch dir: a minimal provider block is added when the example
        # omits one, and stub variables are generated for referenced-but-
        # undeclared variables, so that schema decoding is reached
        # (undeclared-variable errors alone would mask it).
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: |
          shopt -s nullglob
          set +e
          fail=0
          for src in examples/resources/* examples/data-sources/*; do
            [ -d "$src" ] || continue
            files=("$src"/*.tf)
            [ "${#files[@]}" -gt 0 ] || continue
            d=$(mktemp -d)
            cp "$src"/*.tf "$d"/
            if ! grep -q "required_providers" "$d"/*.tf; then
              printf 'terraform {\n  required_providers {\n    windows = {\n      source = "kfrlabs/windows"\n    }\n  }\n}\n' > "$d/provider.tf"
            fi
            for v in $(grep -ho 'var\.[A-Za-z0-9_]*' "$d"/*.tf | sort -u | sed 's/var\.//'); do
              grep -q "variable \"$v\"" "$d"/*.tf || echo "variable \"$v\" {}" >> "$d/variables.tf"
            done
            init_out=$(terraform -chdir="$d" init -input=false -backend=false 2>&1)
            if [ $? -ne 0 ]; then
              echo "::error file=$src::terraform init failed: $init_out"
              fail=1
              rm -rf "$d"
              continue
            fi
            if terraform -chdir="$d" validate -json 2>/dev/null | grep -q "Unsupported block type"; then
              echo "::error file=$src::terraform validate: Unsupported block type (use 'timeouts = { ... }', see #142)"
              fail=1
            fi
            rm -rf "$d"
          done
          exit $fail
