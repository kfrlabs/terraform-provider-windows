# Continuous Integration: build / vet / lint / unit-tests on every push and PR.
#
# The unit suite includes the transport tests in internal/winclient, which
# drive a real SSH handshake against an in-process server on loopback (see
# sshtest_test.go). They need no Windows host and no network, so they belong
# here rather than in the acceptance workflow.
#
# Acceptance tests (TF_ACC=1) are NOT executed here: they require a live
# Windows host reachable over SSH and a valid set of credentials. They run in
# testacc-windows.yml, on a Windows runner that acts as its own target.
#
# Matrix: track the Go floor declared in go.mod (currently 1.26). Older
# minors are not buildable under GOTOOLCHAIN=local once the go directive
# moves past them, so keep the matrix at or above that floor.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly so a newly published CVE in an unchanged dependency surfaces
    # without waiting for a PR (see #205). Scheduled runs execute only the
    # govulncheck job below; the other jobs are skipped on this trigger.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & vet (go ${{ matrix.go }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go mod download
        run: go mod download

      # Fail fast on a corrupt or tampered module cache (see #354).
      - name: go mod verify
        run: go mod verify

      - name: go build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...

      # 32-bit guard (#367): vet type-checks test files, no 32-bit runner needed.
      - name: go vet (386)
        run: GOARCH=386 go vet ./...

  test:
    name: unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # No `needs: build`: `go test` compiles the packages it exercises on its
    # own, in a fresh runner that shares no build cache with the `build` job
    # anyway. Gating this job behind `build` only serialised two independent
    # ~20-40s jobs for no benefit; running them in parallel is the single
    # biggest win in this workflow's wall-clock time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Use the toolchain pinned in go.mod for the canonical test run.
          go-version-file: go.mod
          cache: true

      - name: go test -short
        run: go test -short -race -timeout 300s -coverprofile=coverage.out ./...

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: golangci-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          # .golangci.yml at the repo root drives the rule set (incl. run.timeout).

  sync-agent-ports:
    # The `.claude/agents` and `.opencode/agents` ports must stay
    # byte-identical (see .claude/README.md and .opencode/README.md
    # canonical-and-sync rule), as must the `/windows-resource`
    # orchestrator pair. A one-sided edit silently breaks the other client.
    name: agent ports in sync
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: agent ports in sync
        run: |
          shopt -s nullglob globstar
          fail=0
          for f in .claude/agents/**/*.md; do
            rel=${f#.claude/agents/}
            if ! cmp -s "$f" ".opencode/agents/$rel"; then
              echo "::error file=$f::diverges from .opencode/agents/$rel (ports must stay byte-identical)"
              fail=1
            fi
          done
          if ! cmp -s .claude/commands/windows-resource.md .opencode/commands/windows-resource.md; then
            echo "::error file=.claude/commands/windows-resource.md::diverges from .opencode/commands/windows-resource.md (must stay byte-identical)"
            fail=1
          fi
          for f in .opencode/agents/**/*.md; do
            rel=${f#.opencode/agents/}
            if [ ! -e ".claude/agents/$rel" ]; then
              echo "::error file=$f::exists only under .opencode/agents (ports must match both ways)"
              fail=1
            fi
          done
          exit $fail

  govulncheck:
    # Reachability-aware vulnerability scan (see #205). Blocking: unlike
    # Dependabot version updates, it fails the PR when a CVE is reachable
    # from provider code, and stays quiet otherwise.
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  terraform-cli-offline:
    # Hermetic Terraform-CLI tier for test/terraform-cli: init, fmt -check,
    # validate and the mocked `terraform test` run — none of which needs a
    # Windows host or credentials. This exercises the provider through the
    # real CLI (schema serving, example HCL, mock wiring) in a way Go unit
    # tests cannot. Online --apply stages stay out: they need the lab host.
    name: terraform CLI offline suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build provider (linux_amd64 dev build)
        run: go build -trimpath -o ${{ runner.temp }}/plugins/terraform-provider-windows .

      # Pinned to the version the suite is verified against (see #134).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: offline stages (init, fmt, validate, mocked test)
        working-directory: test/terraform-cli
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: |
          printf 'provider_installation {\n  dev_overrides {\n    "kfrlabs/windows" = "%s/plugins"\n  }\n  direct {}\n}\n' '${{ runner.temp }}' > "$TF_CLI_CONFIG_FILE"
          terraform init -input=false
          terraform fmt -check -diff .
          terraform validate
          terraform test -test-directory=.

      - name: examples schema-decode check (no Unsupported block type)
        # Guards #142: SingleNestedAttribute values such as `timeouts` must
        # use the assignment form (`timeouts = { ... }`); the bare block form
        # (`timeouts { ... }`) is rejected by `terraform validate` with
        # "Unsupported block type". Each examples/ directory is validated in
        # a scratch dir: a minimal provider block is added when the example
        # omits one, and stub variables are generated for referenced-but-
        # undeclared variables, so that schema decoding is reached
        # (undeclared-variable errors alone would mask it).
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: |
          shopt -s nullglob
          set +e
          fail=0
          for src in examples/resources/* examples/data-sources/*; do
            [ -d "$src" ] || continue
            files=("$src"/*.tf)
            [ "${#files[@]}" -gt 0 ] || continue
            d=$(mktemp -d)
            cp "$src"/*.tf "$d"/
            if ! grep -q "required_providers" "$d"/*.tf; then
              printf 'terraform {\n  required_providers {\n    windows = {\n      source = "kfrlabs/windows"\n    }\n  }\n}\n' > "$d/provider.tf"
            fi
            for v in $(grep -ho 'var\.[A-Za-z0-9_]*' "$d"/*.tf | sort -u | sed 's/var\.//'); do
              grep -q "variable \"$v\"" "$d"/*.tf || echo "variable \"$v\" {}" >> "$d/variables.tf"
            done
            init_out=$(terraform -chdir="$d" init -input=false -backend=false 2>&1)
            if [ $? -ne 0 ]; then
              echo "::error file=$src::terraform init failed: $init_out"
              fail=1
              rm -rf "$d"
              continue
            fi
            if terraform -chdir="$d" validate -json 2>/dev/null | grep -q "Unsupported block type"; then
              echo "::error file=$src::terraform validate: Unsupported block type (use 'timeouts = { ... }', see #142)"
              fail=1
            fi
            rm -rf "$d"
          done
          exit $fail

  min-terraform:
    # Minimum-supported Terraform CLI gate (#239): WriteOnly attributes
    # require Terraform 1.11+, so the provider must init + validate cleanly
    # on the oldest supported CLI — both for a plain resource and for one
    # using a *_wo argument. Offline: init -backend=false + validate only,
    # no apply, no Windows host.
    name: min Terraform ${{ matrix.terraform }} offline check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # setup-terraform resolves a partial version to the latest 1.11.x patch.
        terraform: ["1.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build provider (linux_amd64 dev build)
        run: go build -trimpath -o ${{ runner.temp }}/plugins/terraform-provider-windows .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: init + validate minimal fixtures (plain and WriteOnly)
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: |
          printf 'provider_installation {\n  dev_overrides {\n    "kfrlabs/windows" = "%s/plugins"\n  }\n  direct {}\n}\n' '${{ runner.temp }}' > "$TF_CLI_CONFIG_FILE"
          base=$(mktemp -d)
          # Fixture 1: no WriteOnly argument (windows_directory).
          mkdir -p "$base/plain"
          cat > "$base/plain/main.tf" <<'EOF'
          terraform {
            required_version = ">= 1.11"

            required_providers {
              windows = {
                source = "kfrlabs/windows"
              }
            }
          }

          provider "windows" {
            host                     = "example.invalid"
            username                 = "tfacc"
            insecure_ignore_host_key = true
          }

          resource "windows_directory" "min" {
            path = "C:\\ProgramData\\min-terraform"
          }
          EOF
          # Fixture 2: WriteOnly argument (windows_file content_wo).
          mkdir -p "$base/writeonly"
          cat > "$base/writeonly/main.tf" <<'EOF'
          terraform {
            required_version = ">= 1.11"

            required_providers {
              windows = {
                source = "kfrlabs/windows"
              }
            }
          }

          provider "windows" {
            host                     = "example.invalid"
            username                 = "tfacc"
            insecure_ignore_host_key = true
          }

          resource "windows_file" "min_wo" {
            path               = "C:\\ProgramData\\min-terraform\\secret.txt"
            content_wo         = "min-terraform fixture secret"
            content_wo_version = "1"
            create_parents     = true
          }
          EOF
          terraform -chdir="$base/plain" init -input=false -backend=false
          terraform -chdir="$base/plain" validate
          terraform -chdir="$base/writeonly" init -input=false -backend=false
          terraform -chdir="$base/writeonly" validate
