# Release: builds registry-compatible provider archives on every v* tag.
#
# Push a tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) and this
# workflow runs GoReleaser, which compiles the provider for every supported
# OS/arch, zips each binary, and attaches the checksums (+ GPG signature) to
# the GitHub release. The Terraform Registry picks the release up from there.
#
# The `gate` job must pass before anything is published: the tagged commit
# has to be on main, and build/vet, unit tests and golangci-lint must be
# green on it. The latest testacc-windows run for the tagged commit must
# also have concluded success with the full suite (a push-to-main or plain
# workflow_dispatch run, mode=full): selective PR and run_filter runs do
# not qualify, and docs-only/mode=none commits (which leave no run) must
# use the auditable workflow_dispatch bypass below.
#
# Manual releases (workflow_dispatch for a tag) may set
# allow_acceptance_bypass together with a bypass_justification. The bypass
# is honoured only on workflow_dispatch, is echoed to the step summary,
# and is appended to the release notes. Tag pushes can never bypass.
#
# Each release also ships an SPDX SBOM per archive (GoReleaser + syft) and a
# GitHub build provenance attestation (Sigstore) covering every file listed
# in SHA256SUMS. Verify with:
#   gh attestation verify <file> --repo kfrlabs/terraform-provider-windows
# GPG signing of the checksums is kept: the Terraform Registry requires it.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   - GPG_PRIVATE_KEY : ASCII-armoured private key used to sign the checksums
#   - GPG_PASSPHRASE  : its passphrase
# The signing fingerprint is read from the imported key itself
# (steps.gpg.outputs.fingerprint), so no GPG_FINGERPRINT secret is needed.
# The Registry also requires the matching public key registered on the
# release account's registry settings.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (e.g. v0.2.0); must point to a commit on main."
        required: true
      allow_acceptance_bypass:
        description: "Skip the blocking testacc-windows gate (auditable override; justification required)."
        required: false
        default: false
        type: boolean
      bypass_justification:
        description: "Why the acceptance gate is bypassed (recorded in the step summary and release notes)."
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      bypassed: ${{ steps.acceptance.outputs.bypassed }}
      bypass_justification: ${{ steps.acceptance.outputs.justification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Tag pushes release GITHUB_REF_NAME; manual runs release the tag input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::tag '$TAG' does not match v*"
              exit 1
              ;;
          esac
          SHA=$(git rev-list -n 1 "$TAG") || {
            echo "::error::tag '$TAG' not found"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: tagged commit is on main
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag $TAG points to $TAG_SHA, which is not on main"
            exit 1
          fi

      - name: testacc-windows gate (blocking)
        id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          BYPASS: ${{ inputs.allow_acceptance_bypass }}
          JUSTIFICATION: ${{ inputs.bypass_justification }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # The bypass is an auditable override for manual releases only:
          # tag pushes always require a green full acceptance run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$BYPASS" = "true" ]; then
            if [ -z "$(printf '%s' "$JUSTIFICATION" | tr -d '[:space:]')" ]; then
              echo "::error::allow_acceptance_bypass requires bypass_justification"
              exit 1
            fi
            {
              echo "### release gate: acceptance bypassed"
              echo ""
              echo "$JUSTIFICATION"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bypassed=true" >> "$GITHUB_OUTPUT"
            DELIM="BYPASS_EOF_${GITHUB_RUN_ID}_${RANDOM}_${RANDOM}"
            {
              echo "justification<<$DELIM"
              echo "$JUSTIFICATION"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bypassed=false" >> "$GITHUB_OUTPUT"
          echo "justification=" >> "$GITHUB_OUTPUT"
          # Latest testacc-windows run for the tagged commit (fail-closed:
          # unknown results block the release; the bypass covers them).
          run_json=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$TAG_SHA" \
            --workflow testacc-windows.yml --limit 1 \
            --json databaseId,url,headSha,headBranch,event,conclusion) || {
            echo "::error::could not query testacc-windows runs on $TAG_SHA (fail-closed; manual releases may use allow_acceptance_bypass with a justification)"
            exit 1
          }
          if [ -z "$run_json" ] || [ "$run_json" = "[]" ]; then
            echo "::error::no testacc-windows run on $TAG_SHA (tag $TAG): docs-only/mode=none commits leave no run and must use the workflow_dispatch bypass with a justification"
            exit 1
          fi
          run_id=$(echo "$run_json" | jq -r '.[0].databaseId // "unknown"')
          run_url=$(echo "$run_json" | jq -r '.[0].url // "unknown"')
          run_head=$(echo "$run_json" | jq -r '.[0].headSha // "unknown"')
          run_branch=$(echo "$run_json" | jq -r '.[0].headBranch // "unknown"')
          run_event=$(echo "$run_json" | jq -r '.[0].event // "unknown"')
          conclusion=$(echo "$run_json" | jq -r '.[0].conclusion // "unknown"')
          if [ "$run_head" != "$TAG_SHA" ]; then
            echo "::error::testacc-windows run $run_url is for head $run_head, expected $TAG_SHA (tag $TAG)"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::latest testacc-windows run on $TAG_SHA concluded '$conclusion' ($run_url): the gate requires success"
            exit 1
          fi
          # Only full-suite runs qualify: selective PR and run_filter runs do not.
          case "$run_event" in
            push|workflow_dispatch) ;;
            *)
              echo "::error::testacc-windows run $run_url used event '$run_event': only full runs (push to main, plain workflow_dispatch) qualify"
              exit 1
              ;;
          esac
          if [ "$run_branch" != "main" ]; then
            echo "::error::testacc-windows run $run_url ran on branch '$run_branch': only runs on main qualify"
            exit 1
          fi
          job_names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --paginate -q '.jobs[].name') || {
            echo "::error::could not inspect jobs of testacc-windows run $run_url (fail-closed; manual releases may use allow_acceptance_bypass with a justification)"
            exit 1
          }
          if ! echo "$job_names" | grep -q '^acceptance '; then
            echo "::error::testacc-windows run $run_url ran no acceptance jobs (mode=none): releases for such commits must use the workflow_dispatch bypass with a justification"
            exit 1
          fi
          if echo "$job_names" | grep -q 'run-filter'; then
            echo "::error::testacc-windows run $run_url used run_filter (mode=filter): only full runs qualify"
            exit 1
          fi
          echo "testacc-windows run $run_id $run_url head $run_head event $run_event branch $run_branch conclusion $conclusion mode full"
          {
            echo "### release gate: testacc-windows"
            echo ""
            echo "- run: $run_url"
            echo "- head SHA: $run_head (tag $TAG -> $TAG_SHA)"
            echo "- event: $run_event / branch: $run_branch"
            echo "- conclusion: $conclusion"
            echo "- mode: full (push-to-main/plain-dispatch run with acceptance jobs, no run-filter)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test -short
        run: go test -short -race -timeout 300s ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  goreleaser:
    name: goreleaser release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Manual runs check out the triggering branch, so move to the tag the
      # gate approved; tag pushes already sit on it.
      - name: checkout release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: git checkout "$TAG"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # syft generates the per-archive SBOMs declared in .goreleaser.yml.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      - name: resolve checksums file
        id: sums
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        # GITHUB_REF_NAME is the branch on workflow_dispatch, so the tag
        # comes from the gate (push ref or dispatch input).
        run: echo "path=dist/terraform-provider-windows_${TAG#v}_SHA256SUMS" >> "$GITHUB_OUTPUT"

      # SHA256SUMS lists the archives, the registry manifest and the SBOMs,
      # so a single attestation covers every published file.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.sums.outputs.path }}

      # The bypass is already in the gate step summary; appending it here
      # keeps the published release itself auditable.
      - name: annotate acceptance bypass in release notes
        if: needs.gate.outputs.bypassed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
          BYPASS_JUSTIFICATION: ${{ needs.gate.outputs.bypass_justification }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          {
            echo ""
            echo "---"
            echo ""
            echo "> **Acceptance gate bypassed:** $BYPASS_JUSTIFICATION"
          } >> "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
