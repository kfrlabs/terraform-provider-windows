# Acceptance (functional) tests against GitHub-hosted Windows runners.
#
# Unlike test.yml (build/vet/unit/lint on ubuntu), this workflow runs the real
# acceptance suite (TF_ACC=1, build tag `acceptance`) that drives the provider
# over SSH. It needs a live Windows target, so it runs on `windows-latest`
# and turns the runner INTO its own target: it provisions a dedicated local
# admin, enables the OpenSSH Server that the image already ships, and points
# WINDOWS_HOST at the runner itself. Fully ephemeral, no external host, no
# repository secrets. It stays on GitHub-hosted runners on purpose: it runs on
# pull requests, and this repository is public (see testacc-lab-container.yml
# for the self-hosted counterpart).
#
# Layout:
#
#   * `plan` (ubuntu) decides what to run (.github/scripts/testacc-plan.py) and
#     cross-compiles the acceptance test binary once for every Windows job, so
#     the Windows runners need no Go toolchain, module download or cache save
#     (that alone used to cost ~3min per job).
#   * Pull requests are selective: only the acceptance tests of the resource
#     families whose files changed run (resource_windows_<x>*.go,
#     datasource_windows_<x>*.go, winclient/<x>*.go), password auth only,
#     packed in lanes of at most 30 tests. A change to shared code (transport,
#     provider wiring, acceptance helpers, go.mod/go.sum, this CI) runs the
#     full suite instead; unit-test-only changes run nothing here.
#   * Pushes to main and workflow_dispatch run the full suite, the safety net
#     for cross-resource regressions a selective PR run cannot see.
#   * Full runs use `githubLanes` from .github/testacc-groups.json:
#     windows_feature write tests cost ~6.5min each (DISM is machine-global),
#     so TestAccWindowsFeature_Basic and _Import keep a dedicated runner and
#     bound the wall time; every other family gets its own runner. Public-key
#     auth only changes the SSH handshake, so it skips the two feature jobs.
#   * Groups marked `githubHosted: false` (IIS: the windows-latest image never
#     provides the WebAdministration module, so those tests spent ~7min
#     installing IIS only to skip) are left to testacc-lab-container.yml.
#   * Do NOT run several families concurrently on one runner: tried in
#     40766054855, the tests are CPU/memory bound on a 4-vCPU windows-latest
#     (terraform, provider and remote PowerShell all run on the same box).
#     Each family took 2-3x longer, nothing was gained in wall time, and the
#     runner ran out of memory ("The paging file is too small").

name: testacc-windows

on:
  workflow_dispatch:
    inputs:
      run_filter:
        description: "Value passed to `go test -run` (regexp). Replaces the group split: one job per auth mode runs it."
        required: false
        default: ""
  # A transport change that only breaks against a real Windows sshd would
  # otherwise reach main unnoticed: the unit suite never dials a Windows host.
  pull_request:
    branches: [main]
    paths: &acc-paths
      - "internal/winclient/**"
      - "internal/provider/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/testacc-windows.yml"
      - ".github/scripts/Invoke-AccTests.ps1"
      - ".github/scripts/testacc-plan.py"
      - ".github/testacc-groups.json"
      - ".github/testacc-allowed-skips.json"
  push:
    branches: [main]
    paths: *acc-paths

permissions:
  contents: read

concurrency:
  group: testacc-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff needs the merge base of the PR.
          fetch-depth: 0

      - name: Plan acceptance jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_FILTER: ${{ inputs.run_filter }}
        run: python3 .github/scripts/testacc-plan.py --event "$EVENT" --base "$BASE" --head "${HEAD:-HEAD}" --run-filter "$RUN_FILTER"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.plan.outputs.mode != 'none'
        with:
          # Canonical toolchain: track the version pinned in go.mod.
          go-version-file: go.mod
          cache: true

      - name: Build acceptance test binary (windows/amd64)
        if: steps.plan.outputs.mode != 'none'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go test -c -tags acceptance -o provider-acc.test.exe ./internal/provider/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.plan.outputs.mode != 'none'
        with:
          name: provider-acc-test
          path: provider-acc.test.exe
          retention-days: 1
          if-no-files-found: error

  acceptance:
    name: acceptance (${{ matrix.auth }}, ${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: provider-acc-test
          path: ${{ runner.temp }}

      # Provision the runner as its own SSH target. A dedicated local admin
      # with a random password is used instead of the runner account so no
      # ambient credential is exposed. The windows-latest image already ships
      # the OpenSSH Server capability (this step takes ~10s), so the install
      # branch below is only a fallback for an image that drops it.
      - name: Configure local SSH target
        run: |
          $ErrorActionPreference = 'Stop'

          $user = 'tfacc'
          # Alphanumeric core (avoids chars that would confuse $GITHUB_ENV
          # parsing) plus a fixed suffix guaranteeing password complexity.
          $chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $core  = -join (1..20 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $pass  = "$core-aB3z"
          Write-Host "::add-mask::$pass"
          $secure = ConvertTo-SecureString $pass -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $secure
          } else {
            New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

          if (-not (Get-Service -Name sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }

          Set-Service -Name sshd -StartupType Automatic

          # PowerShell as the default shell for incoming SSH sessions, so the
          # bootstrap command (`powershell.exe -EncodedCommand ...`) runs
          # exactly as it would against any Windows host with OpenSSH Server.
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell `
            -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' `
            -PropertyType String -Force | Out-Null

          if (-not (Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
          }

          # Public-key auth needs the key registered before sshd starts, so it
          # is provisioned here and sshd is (re)started only once. Because
          # tfacc is an administrator, Windows OpenSSH reads
          # administrators_authorized_keys rather than the per-user file, and
          # refuses it unless its ACL is restricted to SYSTEM and Administrators.
          if ('${{ matrix.auth }}' -eq 'publickey') {
            $keyPath = Join-Path $env:RUNNER_TEMP 'id_ed25519'
            Remove-Item "$keyPath", "$keyPath.pub" -Force -ErrorAction SilentlyContinue
            # -N '' and not -N '""': the doubled-quote form is a PowerShell 5.1
            # workaround, and under pwsh 7 it passes two literal quote
            # characters as the passphrase. The key would then be encrypted,
            # unusable under BatchMode, and the failure would surface as a bare
            # "Permission denied (publickey)" with nothing pointing back here.
            & ssh-keygen -t ed25519 -f $keyPath -N '' -C 'tfacc-acceptance' -q
            if (-not (Test-Path "$keyPath.pub")) { throw "ssh-keygen did not produce a key pair" }

            # Prove the key really has no passphrase rather than trusting the
            # quoting above: -y with an empty -P fails on an encrypted key.
            & ssh-keygen -y -P '' -f $keyPath | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "the generated key is passphrase-protected; check the -N quoting for this shell"
            }

            New-Item -ItemType Directory -Force -Path (Join-Path $env:ProgramData 'ssh') | Out-Null
            $akFile = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
            Get-Content "$keyPath.pub" | Set-Content -Path $akFile -Encoding ascii
            & icacls $akFile /inheritance:r /grant 'SYSTEM:F' /grant 'Administrators:F' | Out-Null
            "WINDOWS_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          Restart-Service sshd

          # Restart-Service returns before sshd is necessarily accepting again;
          # without this wait an auth failure and a not-yet-listening socket
          # are indistinguishable.
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 22 -WarningAction SilentlyContinue).TcpTestSucceeded) {
            if ((Get-Date) -gt $deadline) { throw "sshd is not accepting connections on port 22" }
            Start-Sleep -Milliseconds 500
          }

          "WINDOWS_HOST=127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_USERNAME=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_PASSWORD=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The provider verifies host keys by default, so the suite needs a
      # known_hosts baseline. Scanning the key we just generated locally is
      # sound here precisely because the target is this same runner: there is
      # no network path for an interposed host to sit on. Do NOT copy this
      # pattern for a remote target, where the fingerprint must be established
      # out of band.
      - name: Record host key for verification
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'known_hosts'
          $keys = & ssh-keyscan -p 22 $env:WINDOWS_HOST 2>$null
          if (-not $keys) {
            throw "ssh-keyscan returned no host key for $($env:WINDOWS_HOST)"
          }
          $keys | Set-Content -Path $path -Encoding ascii
          Write-Host "Recorded $(($keys | Measure-Object).Count) host key(s) in $path"
          "WINDOWS_KNOWN_HOSTS=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Fail fast with an unambiguous signal: BatchMode forbids any password
      # fallback, so this only succeeds if the key itself authenticated.
      - name: SSH key auth smoke test
        if: matrix.auth == 'publickey'
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "$($env:WINDOWS_USERNAME)@$($env:WINDOWS_HOST)"
          $out = & ssh -i $env:WINDOWS_PRIVATE_KEY_PATH -o BatchMode=yes `
            -o UserKnownHostsFile=$env:WINDOWS_KNOWN_HOSTS `
            $target 'Write-Output KEYAUTH_OK'
          if ($LASTEXITCODE -ne 0 -or $out -notcontains 'KEYAUTH_OK') {
            # "Permission denied (publickey)" alone cannot distinguish a client
            # that could not load the key from a server that rejected it, so
            # collect both sides before failing.
            Write-Host '--- ssh -vvv ---'
            & ssh -vvv -i $env:WINDOWS_PRIVATE_KEY_PATH -o BatchMode=yes `
              -o UserKnownHostsFile=$env:WINDOWS_KNOWN_HOSTS `
              $target 'Write-Output KEYAUTH_OK' 2>&1 | Out-Host
            Write-Host '--- authorized_keys ACL ---'
            $akFile = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
            & icacls $akFile | Out-Host
            Get-Content $akFile | ForEach-Object { $_.Substring(0, [Math]::Min(40, $_.Length)) + '...' } | Out-Host
            Write-Host '--- sshd log ---'
            Get-Content (Join-Path $env:ProgramData 'ssh\logs\sshd.log') -Tail 40 -ErrorAction SilentlyContinue | Out-Host
            Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 40 -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.TimeCreated) $($_.Message)" } | Out-Host
            throw "public-key authentication failed (exit $LASTEXITCODE): $out"
          }
          Write-Host "Public-key authentication confirmed"

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          # Planned per job: empty runs the `lanes` groups, otherwise a
          # `go test -run` regexp (selective PR lanes, run_filter).
          RUN_FILTER: ${{ matrix.run }}
        run: |
          # Each auth job proves its own path: the key job runs without a
          # password, the password job without a key.
          if ('${{ matrix.auth }}' -eq 'publickey') { $env:WINDOWS_PASSWORD = $null } else { $env:WINDOWS_PRIVATE_KEY_PATH = $null }
          # -Timeout 30m (job timeout 45m) so a hung test panics with a
          # goroutine dump before the runner is cancelled.
          & ./.github/scripts/Invoke-AccTests.ps1 `
            -Binary "$env:RUNNER_TEMP\provider-acc.test.exe" `
            -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'internal\provider') `
            -Lanes '${{ matrix.lanes }}' `
            -RunFilter "$env:RUN_FILTER" `
            -LogDirectory (Join-Path $env:RUNNER_TEMP 'testacc-logs') `
            -Timeout 30m `
            -AllowedSkipsFile (Join-Path $env:GITHUB_WORKSPACE '.github\testacc-allowed-skips.json') `
            -Title 'acceptance (${{ matrix.auth }}, ${{ matrix.name }})'
          exit $LASTEXITCODE

  # Single stable check name whatever the planned matrix looks like (it changes
  # per PR), suitable as a required status check.
  result:
    name: testacc-windows result
    needs: [plan, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check acceptance outcome
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          ACC: ${{ needs.acceptance.result }}
        run: |
          echo "plan=$PLAN mode=$MODE acceptance=$ACC"
          [ "$PLAN" = success ] || exit 1
          [ "$MODE" = none ] || [ "$ACC" = success ]
