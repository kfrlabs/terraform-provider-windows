# Full acceptance suite against the persistent lab container, on the
# self-hosted Windows runner.
#
# Unlike testacc-windows.yml (GitHub-hosted windows-latest, turned INTO its
# own ephemeral target, sharded to stay inside free/billed runner minutes),
# this workflow targets the throwaway container documented in
# test/windows-container/README.md: a long-lived `tfacc-win` container
# running on the `LAB-WINDOCKER-01` self-hosted runner's own Docker host,
# published on port 2222. Same host, so no extra network hop beyond the
# published port; the runner reaches it over the host's LAN IP (its own
# container network cannot resolve the sibling container by name or via
# "localhost", only via the host's published port).
#
# This is deliberately NOT wired to pull_request: self-hosted runners
# executing arbitrary fork-PR code is the textbook privilege-escalation path
# (see GitHub's own self-hosted-runner security guidance), and this runner
# also has Docker-host-level reach on the lab network. workflow_dispatch and
# a nightly schedule keep it opt-in / maintainer-triggered only.
#
# The whole suite runs in one shot (no shard matrix): this runner is not
# billed per minute like testacc-windows.yml's windows-latest jobs, so the
# sharding that exists purely to fit a billed-minutes budget is unnecessary
# here. Tests still execute strictly back to back (none use t.Parallel(),
# see testacc-windows.yml's header for why windows_feature can't), so total
# runtime is the sum of every acceptance test — budget ~45-60 minutes.

name: testacc-lab-container

on:
  workflow_dispatch:
    inputs:
      run_filter:
        description: "Value passed to `go test -run` (regexp). Default: the full ^TestAcc suite."
        required: false
        default: "^TestAcc"
      recreate_container:
        description: "Recreate the tfacc-win container from scratch before testing (slower, but clears any state left over from a previous failed run)."
        type: boolean
        required: false
        default: false
  schedule:
    # Nightly, well outside business hours (UTC). Catches drift between
    # releases without needing a human to remember to run it.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: testacc-lab-container
  cancel-in-progress: false

jobs:
  acceptance:
    name: acceptance (lab container, full suite)
    runs-on: [self-hosted, windows-2025, self-hosted-kfrlabs]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_HOST: ${{ secrets.LAB_WINDOWS_HOST }}
      WINDOWS_PORT: "2222"
      WINDOWS_USERNAME: "tfacc"
      WINDOWS_PASSWORD: ${{ secrets.LAB_WINDOWS_PASSWORD }}
      WINDOWS_INSECURE_IGNORE_HOST_KEY: "true"
      TF_ACC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The container is long-lived by design (see test/windows-container/
      # README.md); only rebuild it on request or when it is missing/stopped.
      - name: Ensure tfacc-win container is running
        run: |
          $ErrorActionPreference = 'Stop'
          $recreate = "${{ inputs.recreate_container }}" -eq 'true'
          $existing = docker ps -a --filter "name=^tfacc-win$" --format '{{.Names}}'

          if ($recreate -and $existing) {
            Write-Host "Recreating tfacc-win (recreate_container=true)"
            docker rm -f tfacc-win
            $existing = $null
          }

          if (-not $existing) {
            $ctx = Join-Path $env:RUNNER_TEMP 'tfacc-ctx'
            New-Item -ItemType Directory -Force -Path $ctx | Out-Null
            Copy-Item -Recurse -Force C:\Windows\System32\OpenSSH (Join-Path $ctx 'OpenSSH')
            Copy-Item -Force (Join-Path $env:GITHUB_WORKSPACE 'test\windows-container\Dockerfile') $ctx
            Copy-Item -Force (Join-Path $env:GITHUB_WORKSPACE 'test\windows-container\entrypoint.cmd') $ctx
            docker build -t tfacc-win:latest $ctx
            docker run -d --name tfacc-win -p 2222:22 tfacc-win:latest
            Start-Sleep -Seconds 5
          } else {
            $running = docker ps --filter "name=^tfacc-win$" --format '{{.Names}}'
            if (-not $running) {
              Write-Host "tfacc-win exists but is stopped; starting it"
              docker start tfacc-win
              Start-Sleep -Seconds 5
            } else {
              Write-Host "tfacc-win already running, reusing it"
            }
          }

      - name: SSH smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Test-NetConnection -ComputerName $env:WINDOWS_HOST -Port $env:WINDOWS_PORT
          if (-not $result.TcpTestSucceeded) {
            throw "tfacc-win is not accepting connections on $($env:WINDOWS_HOST):$($env:WINDOWS_PORT)"
          }
          Write-Host "SSH reachable on $($env:WINDOWS_HOST):$($env:WINDOWS_PORT)"

      - name: Download modules
        run: go mod download

      - name: go test (acceptance, full suite)
        run: |
          go test -tags acceptance ./internal/provider/ -v -timeout 85m -run "${{ inputs.run_filter || '^TestAcc' }}"

      - name: Container diagnostics (always, on failure helps triage)
        if: failure()
        run: |
          docker logs tfacc-win --tail 100
