# Full acceptance suite against the persistent lab container, on the
# self-hosted Windows runner.
#
# Unlike testacc-windows.yml (GitHub-hosted windows-latest, turned INTO its
# own ephemeral target), this workflow targets the container documented in
# test/windows-container/README.md: a long-lived `tfacc-win` container
# running on the `LAB-WINDOCKER-01` self-hosted runner's own Docker host,
# published on port 2222. The runner reaches it over the host's LAN IP (its
# own container network cannot resolve the sibling container by name or via
# "localhost", only via the host's published port).
#
# This is deliberately NOT wired to pull_request: self-hosted runners
# executing arbitrary fork-PR code is the textbook privilege-escalation path
# (see GitHub's own self-hosted-runner security guidance), and this runner
# also has Docker-host-level reach on the lab network. workflow_dispatch
# keeps it opt-in / maintainer-triggered only.
#
# There is currently no schedule trigger, although the suite was designed
# for a nightly run: the repository is public but the LAB-WINDOCKER-01
# runner's organization group disallows public repositories
# (allows_public_repositories=false), so every scheduled run queued forever
# and was eventually cancelled (see #129). Re-add the cron below once the
# runner is reachable from this repository again — either the group policy
# is relaxed by an organization admin or the runner moves to a group that
# allows public repositories — and close #129 with a green nightly as
# evidence.
#
# Note: the runner sits in an organization runner group. A public repository
# can only use it if that group allows public repositories; otherwise jobs
# stay queued until they are cancelled.
#
# Speed:
#   * The image carries no credential (the password is applied at container
#     start), and its tag is a hash of its build inputs. It is rebuilt only
#     when the Dockerfile, its scripts or the host's OpenSSH change, and the
#     container is recreated only when its image is stale. Rotating
#     LAB_WINDOWS_PASSWORD just resets the account in the running container.
#   * The suite runs as two concurrent lanes (.github/scripts/Invoke-AccTests.ps1,
#     .github/testacc-groups.json): every windows_feature test in one, so DISM
#     work never overlaps with itself, and every other family in the other.
#     The feature lane mostly waits on DISM inside the target container, so it
#     leaves room for the second one. Kept at two: running every family at
#     once was CPU/memory bound on a 4-vCPU runner (see testacc-windows.yml).

name: testacc-lab-container

on:
  workflow_dispatch:
    inputs:
      run_filter:
        description: "Value passed to `go test -run` (regexp), run as a single lane. Empty: the full suite, split into concurrent lanes."
        required: false
        default: ""
      recreate_container:
        description: "Recreate the tfacc-win container from scratch before testing (clears any state left over from a previous failed run)."
        type: boolean
        required: false
        default: false
  # No schedule trigger while #129 is open: with the runner unreachable
  # (public repository vs. allows_public_repositories=false on the runner
  # group), every nightly queued forever and was cancelled. To restore it:
  #   schedule:
  #     # Nightly, well outside business hours (UTC). Catches drift between
  #     # releases without needing a human to remember to run it.
  #     - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: testacc-lab-container
  cancel-in-progress: false

jobs:
  acceptance:
    name: acceptance (lab container, full suite)
    runs-on: [self-hosted, windows-2025, self-hosted-kfrlabs]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_HOST: ${{ secrets.LAB_WINDOWS_HOST }}
      WINDOWS_PORT: "2222"
      WINDOWS_USERNAME: "tfacc"
      WINDOWS_PASSWORD: ${{ secrets.LAB_WINDOWS_PASSWORD }}
      WINDOWS_INSECURE_IGNORE_HOST_KEY: "true"
      TF_ACC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Build the test binary before touching the container, so a compile
      # error fails the job without any Docker work.
      - name: Build acceptance test binary
        run: go test -c -tags acceptance -o "$env:RUNNER_TEMP\provider-acc.test.exe" ./internal/provider/

      - name: Ensure tfacc-win container is up to date
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'tfacc-win'
          $src  = Join-Path $env:GITHUB_WORKSPACE 'test\windows-container'
          $files = @('Dockerfile', 'entrypoint.cmd', 'set-tfacc-user.ps1')
          $parts = @($files | ForEach-Object { (Get-FileHash (Join-Path $src $_)).Hash })
          $parts += (Get-Item C:\Windows\System32\OpenSSH\sshd.exe).VersionInfo.FileVersion
          $sha = [Security.Cryptography.SHA256]::Create()
          $digest = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($parts -join "`n")) | ForEach-Object { $_.ToString('x2') })
          $image = "tfacc-win:$($digest.Substring(0, 12))"

          if (-not (docker images -q $image)) {
            Write-Host "Building $image"
            $ctx = Join-Path $env:RUNNER_TEMP 'tfacc-ctx'
            Remove-Item -Recurse -Force $ctx -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $ctx | Out-Null
            Copy-Item -Recurse -Force C:\Windows\System32\OpenSSH (Join-Path $ctx 'OpenSSH')
            $files | ForEach-Object { Copy-Item -Force (Join-Path $src $_) $ctx }
            docker build -t $image $ctx
            if ($LASTEXITCODE -ne 0) { throw "docker build failed" }
          } else {
            Write-Host "$image already built, reusing it"
          }

          $current = docker ps -a --filter "name=^$name$" --format '{{.Image}}'
          $recreate = '${{ inputs.recreate_container }}' -eq 'true'
          if ($current -and ($recreate -or $current -ne $image)) {
            Write-Host "Removing $name ($current): $(if ($recreate) { 'recreate_container=true' } else { "stale image, want $image" })"
            docker rm -f $name | Out-Null
            $current = $null
          }

          # `-e NAME` without a value copies it from this process, so the
          # password never appears on a command line.
          $env:TFACC_PASSWORD = $env:WINDOWS_PASSWORD
          if (-not $current) {
            # Fail clearly rather than with docker's bind error when another
            # container already publishes the port.
            $holder = docker ps --filter "publish=$($env:WINDOWS_PORT)" --format '{{.Names}}'
            if ($holder) { throw "port $($env:WINDOWS_PORT) is already published by container '$holder'; stop it or change WINDOWS_PORT" }
            docker run -d --name $name -e TFACC_PASSWORD -p "$($env:WINDOWS_PORT):22" $image | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "docker run failed" }
          } else {
            if (-not (docker ps -q --filter "name=^$name$")) {
              Write-Host "$name exists but is stopped; starting it"
              docker start $name | Out-Null
            }
            # Keep the account in sync with the current secret, so rotating
            # LAB_WINDOWS_PASSWORD needs no rebuild and no recreate.
            docker exec -e TFACC_PASSWORD $name powershell -NoProfile -ExecutionPolicy Bypass -File C:\set-tfacc-user.ps1
            if ($LASTEXITCODE -ne 0) { throw "could not set the tfacc password in $name" }
          }

      - name: Wait for SSH
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-NetConnection -ComputerName $env:WINDOWS_HOST -Port $env:WINDOWS_PORT -WarningAction SilentlyContinue).TcpTestSucceeded) {
            if ((Get-Date) -gt $deadline) { throw "tfacc-win is not accepting connections on $($env:WINDOWS_HOST):$($env:WINDOWS_PORT)" }
            Start-Sleep -Seconds 2
          }
          Write-Host "SSH reachable on $($env:WINDOWS_HOST):$($env:WINDOWS_PORT)"

      - name: Run acceptance tests
        env:
          RUN_FILTER: ${{ inputs.run_filter }}
        run: |
          & ./.github/scripts/Invoke-AccTests.ps1 `
            -Binary "$env:RUNNER_TEMP\provider-acc.test.exe" `
            -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'internal\provider') `
            -Lanes 'feature-basic+feature-import+feature-datasource storage+identity-net+scheduling+packages+rest' `
            -RunFilter "$env:RUN_FILTER" `
            -LogDirectory (Join-Path $env:RUNNER_TEMP 'testacc-logs') `
            -Timeout 50m `
            -Title 'acceptance (lab container)'
          exit $LASTEXITCODE

      - name: Container diagnostics
        if: failure()
        run: |
          docker logs tfacc-win --tail 100
