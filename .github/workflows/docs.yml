# Documentation drift gate: regenerates docs/ from the live provider schema
# (tfplugindocs).
#
# MODE = BLOCKING (drift step fails the workflow). Completed in #199.
#
# Why no per-resource templates under templates/ are needed: the curated
# per-page content lives in the schema MarkdownDescriptions and in
# examples/ (resource.tf / data-source.tf / import.sh), which the
# tfplugindocs built-in templates render. Only docs/index.md needs a custom
# template (templates/index.md.tmpl) for the Authentication and Host key
# verification narrative. Verified by running `go generate ./...` on a clean
# checkout: docs/ is byte-identical before and after, so flipping this gate
# destroys no curated content.
#
# What the gate enforces:
#   - tfplugindocs runs `terraform providers schema -json` on the live
#     provider. ANY invalid schema (e.g. an attribute declared both
#     Required and Computed) fails the workflow. This already paid off
#     once during Tier 4 by surfacing the long-standing bug on
#     `windows_registry_value.hive`.
#
#   - Any drift between the committed docs/ and the schema-rendered output
#     fails the workflow. When you change a schema description, an example
#     or an import script, run `make docs` (`go generate ./...`) and commit
#   - Rendering depends on the Terraform CLI version: regenerate with the
#     CI-pinned Terraform (setup-terraform step below, currently 1.9.8). A
#     newer local CLI renders WriteOnly attributes differently and
#     reintroduces drift.

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "internal/provider/**"
      - "examples/**"
      - "docs/**"
      - "templates/**"
      - "generate.go"
      - "tools/**"
      - "go.mod"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: tfplugindocs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # tfplugindocs invokes `terraform providers schema -json` under the
      # hood. Pre-installing the CLI avoids the buggy auto-download path
      # in terraform-plugin-docs <=0.20.1 (expired GPG signing key when
      # the tool tries to fetch Terraform from releases.hashicorp.com).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: go generate ./...
        run: go generate ./...

      - name: detect drift (blocking, see workflow header)
        run: |
          if ! git diff --quiet -- docs/ || [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "::error::docs/ drifts from the schema-rendered output."
            echo "Run 'make docs' (go generate ./...) and commit the result."
            git --no-pager diff --stat -- docs/
            git status --porcelain -- docs/
            exit 1
          fi
          echo "docs/ is in sync with templates/ + schema."
