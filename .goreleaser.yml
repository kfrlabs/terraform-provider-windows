# GoReleaser configuration for terraform-provider-windows.
#
# Produces the registry-compatible release archives:
#   terraform-provider-windows_<version>_<os>_<arch>.zip
# each holding the provider binary, plus SHA256SUMS and its GPG signature.
# Matrix: windows/linux (amd64, arm64, 386, armv6) + darwin (amd64, arm64)
# + freebsd (amd64, arm64, 386, armv6). The 386/arm entries restore the
# v0.0.3-v0.0.14 matrix dropped by v0.1.0 (windows_386, windows_arm,
# linux_386, linux_arm, freebsd_*).
# A GitHub release is cut by .github/workflows/release.yml on every v* tag.

version: 2

project_name: terraform-provider-windows

before:
  hooks:
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - windows
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sig"
      - "${artifact}"
    signature: "${artifact}.sig"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
